name: Build Cudy TR3600 OpenWrt iStore Ajay

# =============================================================================
# TR3600 build kit version
#
# 基底： openwrt-25.12 + Cudy TR3600 v1 板级支援（上游 PR #24596，尚未合併）
#        實際 clone 來源見下面的 env.REPO_URL（編譯必需，非品牌標記）
# 修正： patches/0001-tr3600-fan-pwm0.patch          (風扇 PWM 通道 1 -> 0)
#        patches/0002-mt76-mt7996-sta-rec-before-vow.patch (mt76 STA_REC/VoW 順序)
#        patches/0003-luci-tr3600-fan-keep-pending-input.patch (LuCI 風扇頁 dirty flag)
#        patches/0004-tr3600-led-colours.patch       (LED: GPIO48 白 / GPIO46 紅)
#        patches/0005-tr3600-wifi-mac-layout.patch   (WiFi MAC: 2.4G=base+0, 5G=base+0x10)
#        patches/0006-tr3600-fan-thermal-curve.patch (溫控: 60C 以下停轉, 65/75/85 三段)
# 設定： mt7987-cudy-tr3600-iStore.config
#
# 與原版差異：
#   1. Clone 後會印出實際 HEAD SHA，並與 REPO_COMMIT 比對（只警告、不中斷）。
#   2. 「Download Packages」之後多一個 mt76 patch 預檢步驟：
#      若 backport 打不上去，會在編譯前就失敗，不會白等 2~3 小時。
#   3. diy-iStore-part2.sh 內對 0001/0004/0005/0006 四個 DTS patch 也做了
#      dry-run + 套用後複查，任何一個不生效就 exit 1（不產出壞 image）。
#   4. 風扇插件 luci-app-tr3600-fan 已內建在 vendor/，不再 git clone 第三方
#      倉庫（liangcanming 帳號 2026-10 全部 404，build #1 就是死在這裡）。
#      diy-iStore-part1.sh 之後多一個守門步驟：確認套件存在且腳本是 0755，
#      否則立刻失敗——這個 0644 問題正是本套件要修的原始症狀之一。
#   5. 移除 luci-app-lucky（套件不夠完善）：part1 不再 clone，
#      config 也拿掉 CONFIG_PACKAGE_luci-app-lucky / luci-i18n-lucky-zh-cn。
#   6. diy-iStore-part2.sh 的 argon 主題設定改成不致命：openwrt-25.12 的
#      base-files 已無 etc/config/luci，原腳本的 sed 在 `set -e` 下會直接
#      打死編譯（build #2 的死因）。主題本來就由 CONFIG_DEFAULT_THEME 決定。
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  DEVICE_NAME: Cudy-TR3600
  DEVICE_MODEL: Cudy TR3600
  FIRMWARE_PREFIX: Cudy-TR3600-Ajay
  # 上游原始碼位置。編譯必需，但它是「實作細節」不是品牌：
  # 所有對外輸出（release tag / 標題 / 說明 / README）都不再引用這個名字。
  REPO_URL: https://github.com/soapmancn/openwrt
  REPO_BRANCH: agent/cudy-tr3600-v1-6.12
  # 2026-08-11 head of the branch above; used only as a reference for the
  # warning below (the branch itself is what actually gets built).
  REPO_COMMIT: 046aec0dccd9
  # 配置文件路径（相对于仓库根目录）
  CONFIG_FILE: mt7987-cudy-tr3600-iStore.config
  DIY_P1_SH: diy-iStore-part1.sh
  DIY_P2_SH: diy-iStore-part2.sh
  DIY_P3_SH: diy-partX.sh
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
    # =========================================================
    # 1. 检出仓库
    # =========================================================
    - name: Checkout Repository
      uses: actions/checkout@v4

    # =========================================================
    # 2. 释放磁盘空间 & 安装依赖
    # =========================================================
    - name: Free Disk Space & Install Dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm
        sudo docker image prune --all --force

        sudo swapoff -a && sudo rm -f /mnt/swapfile
        sudo fallocate -l 8G /mnt/swapfile
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile

        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential libncurses5-dev gawk \
          git subversion libssl-dev gettext unzip zlib1g-dev file python3 \
          clang llvm dwarves flex bison dos2unix patch

        sudo timedatectl set-timezone "$TZ"

        echo "磁盘空间:"
        df -hT
        echo "内存/Swap:"
        free -h

    # =========================================================
    # 3. 克隆源码
    # =========================================================
    - name: Clone Source Code
      run: |
        git clone -b "$REPO_BRANCH" --single-branch --depth=1 "$REPO_URL" openwrt
        cd openwrt
        HEAD_SHA=$(git rev-parse --short=12 HEAD)
        echo "分支 $REPO_BRANCH 的 HEAD = $HEAD_SHA"
        if [ "$HEAD_SHA" != "$REPO_COMMIT" ]; then
          echo "::warning title=上游分支已移動::分支 HEAD ($HEAD_SHA) 與建置時驗證的 $REPO_COMMIT 不同。patch 預檢步驟會把關。"
        fi

    # =========================================================
    # 4. 执行 DIY 脚本 (diy-iStore-part1.sh)
    # =========================================================
    - name: Execute diy-iStore-part1.sh
      run: |
        cd openwrt
        if [ -f "../$DIY_P1_SH" ]; then
          echo "📜 执行脚本: $DIY_P1_SH"
          cp "../$DIY_P1_SH" ./
          chmod +x "$DIY_P1_SH"
          ./"$DIY_P1_SH"
        else
          echo "⚠️ 跳过: $DIY_P1_SH (文件不存在)"
        fi

        # ---- TR3600 build kit guard: 风扇插件必须就位且可执行 ----
        # 这一步把「静默产出 0644 脚本 -> 上机后 exec_direct EACCES ->
        # LuCI 显示未检测到风扇」这个原始症状，提前变成编译期的硬失败。
        FANPKG=package/custom/luci-app-tr3600-fan
        if [ ! -f "$FANPKG/Makefile" ]; then
          echo "::error title=风扇插件缺失::$FANPKG/Makefile 不存在，diy-iStore-part1.sh 没装成功。"
          ls -la package/custom 2>/dev/null || true
          exit 1
        fi
        for f in "$FANPKG/root/usr/sbin/tr3600-fan" \
                 "$FANPKG/root/etc/init.d/tr3600-fan" \
                 "$FANPKG/root/etc/uci-defaults/99-tr3600-fan"; do
          if [ ! -f "$f" ]; then
            echo "::error title=风扇插件文件缺失::找不到 $f"; exit 1
          fi
          m=$(stat -c %a "$f")
          echo "  $f  mode=$m"
          if [ "$m" != "755" ]; then
            echo "::error title=风扇脚本权限不对::$f 是 $m，应为 755（否则设备上 exec_direct 会 EACCES）"
            exit 1
          fi
        done
        grep -qF "if (!dirty) {" "$FANPKG/htdocs/luci-static/resources/view/tr3600-fan.js" \
          || echo "::warning title=0003 未套用::LuCI 风扇页 dirty flag 补丁没生效（非致命）"
        echo "✅ 风扇插件就位：$FANPKG（脚本 0755）"

    # =========================================================
    # 5. 更新 & 安装 Feeds
    # =========================================================
    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # =========================================================
    # 6. 执行 DIY 脚本 (diy-iStore-part2.sh)
    #    ← 這裡會套用風扇 DTS 與 mt76 backport
    # =========================================================
    - name: Execute diy-iStore-part2.sh
      run: |
        cd openwrt
        if [ -f "../$DIY_P2_SH" ]; then
          echo "📜 执行脚本: $DIY_P2_SH"
          cp "../$DIY_P2_SH" ./
          chmod +x "$DIY_P2_SH"
          ./"$DIY_P2_SH"
        else
          echo "⚠️ 跳过: $DIY_P2_SH (文件不存在)"
        fi

    # =========================================================
    # 7. 复制配置文件 (使用 CONFIG_FILE)
    # =========================================================
    - name: Copy Config File
      run: |
        cd openwrt
        if [ -f "../$CONFIG_FILE" ]; then
          echo "📋 使用配置文件: $CONFIG_FILE"
          cp "../$CONFIG_FILE" .config
          echo "✅ 配置文件已复制到 .config"
        else
          echo "❌ 配置文件不存在: $CONFIG_FILE"
          exit 1
        fi
        # 显示配置摘要
        echo "========================================"
        echo "📋 配置摘要:"
        grep "CONFIG_TARGET_DEVICE" .config || echo "⚠️ 未找到设备配置"
        grep "CONFIG_PACKAGE_luci-app-passwall" .config || echo "⚠️ 未找到 Passwall 配置"
        echo "========================================"

    # =========================================================
    # 8. oldconfig 保留自定义勾选，禁止 make defconfig
    # =========================================================
    - name: Generate Oldconfig
      run: |
        cd openwrt
        make oldconfig
        echo "✅ oldconfig 生成完成"
        # 校验iStore是否仍然=y
        echo "==== iStore config check ===="
        grep -E "luci-app-store|luci-i18n-store-zh-cn" .config
        echo "============================"
        echo "📋 最终配置摘要:"
        grep -E "CONFIG_TARGET_DEVICE|CONFIG_PACKAGE_.*passwall|CONFIG_PACKAGE_luci" .config | head -20
        echo "========================================"

    # =========================================================
    # 9. 执行 DIY 脚本 (diy-partX.sh)
    # =========================================================
    - name: Execute diy-partX.sh
      run: |
        cd openwrt
        if [ -f "../$DIY_P3_SH" ]; then
          echo "📜 执行脚本: $DIY_P3_SH"
          cp "../$DIY_P3_SH" ./
          chmod +x "$DIY_P3_SH"
          ./"$DIY_P3_SH"
        else
          echo "⚠️ 跳过: $DIY_P3_SH (文件不存在)"
        fi

    # =========================================================
    # 10. SSH 调试（可选）
    # =========================================================
    - name: SSH Debug Session
      uses: mxschmitt/action-tmate@v3
      if: github.event.inputs.ssh == 'true'

    # =========================================================
    # 11. 下载软件包
    # =========================================================
    - name: Download Packages
      run: |
        cd openwrt
        make download -j8 || make download -j1 V=s
        find dl -size -1024c -exec rm -f {} \;

    # =========================================================
    # 11b. 【新增】mt76 backport 預檢
    #      在真正編譯前，先把已下載的 mt76 原始碼解開、乾跑一次 patch。
    #      打不上去就立刻失敗，不會白等 2~3 小時才發現。
    # =========================================================
    - name: Verify mt76 backport applies
      run: |
        set -e
        cd openwrt
        MT76_TARBALL="$(find dl -maxdepth 1 -name 'mt76-*.tar.*' | head -1)"
        if [ -z "$MT76_TARBALL" ]; then
          echo "❌ 找不到 mt76 原始碼壓縮檔 (dl/mt76-*.tar.*)"
          ls -la dl | head -40
          exit 1
        fi
        echo "📦 $MT76_TARBALL"

        rm -rf /tmp/mt76check && mkdir -p /tmp/mt76check
        tar -xf "$MT76_TARBALL" -C /tmp/mt76check
        SRC="$(find /tmp/mt76check -maxdepth 1 -mindepth 1 -type d | head -1)"
        echo "📂 $SRC"

        echo "--- mt7996_mcu_add_sta() 附近 ---"
        grep -n "mt7996_mcu_add_group" "$SRC/mt7996/mcu.c" || true

        cd "$SRC"
        echo "--- dry-run 套用 backport ---"
        patch -p1 --dry-run --forward < "$GITHUB_WORKSPACE/patches/0002-mt76-mt7996-sta-rec-before-vow.patch"
        echo "✅ mt76 backport 可正常套用"

    # =========================================================
    # 12. 编译固件
    # =========================================================
    - name: Compile Firmware
      id: compile
      run: |
        cd openwrt

        echo "🔨 开始编译... ($(nproc) 线程)"

        if make -j"$(nproc)"; then
          echo "✅ 多线程编译成功"
        elif make -j1; then
          echo "✅ 单线程编译成功"
        elif make -j1 V=s; then
          echo "✅ 单线程详细日志编译成功"
        else
          echo "❌ 编译失败"
          exit 1
        fi

        echo "status=success" >> "$GITHUB_OUTPUT"
        BUILD_TIMESTAMP=$(date +"%Y%m%d-%H%M")
        echo "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" >> "$GITHUB_ENV"

        echo "========================================"
        echo "✅ 固件编译完成"
        echo "📅 编译时间: $(date '+%Y-%m-%d %H:%M:%S')"
        df -hT /
        echo "========================================"

    # =========================================================
    # 13. 整理固件文件
    # =========================================================
    - name: Organize Firmware Files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE_DIR=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

        echo "📦 固件文件列表:"
        ls -lah

    # =========================================================
    # 13b. 【新增】把關鍵修正的證據存成 log artifact
    # =========================================================
    - name: Dump build evidence
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        {
          echo "=== openwrt HEAD ==="
          git -C openwrt rev-parse HEAD
          echo
          echo "=== fan DTS pwm lines ==="
          grep -nE 'pwms = <&pwm|pinctrl-0 = <&pwm' \
            openwrt/target/linux/mediatek/dts/mt7987b-cudy-tr3600-v1.dts
          echo
          echo "=== LED colours (expect led-0=white@48, led-1=red@46) ==="
          grep -nE 'led_status_(white|red): led-[01]|color = |gpios = <&pio 4[68]|function = LED_FUNCTION' \
            openwrt/target/linux/mediatek/dts/mt7987b-cudy-tr3600-v1.dts
          echo
          echo "=== WiFi MAC layout (expect band@0 -> 0, band@1 -> 16) ==="
          grep -nE 'nvmem-cells = <&macaddr_bdinfo_de00' \
            openwrt/target/linux/mediatek/dts/mt7987b-cudy-tr3600-v1.dts
          echo
          echo "=== thermal curve (expect cooling-levels 0 64 160 255 / trips 65/75/85 C) ==="
          grep -nE 'cooling-levels|active-(low|med|high)|temperature = <6[05]000>|temperature = <7[05]000>|temperature = <85000>' \
            openwrt/target/linux/mediatek/dts/mt7987b-cudy-tr3600-v1.dts
          echo
          echo "=== mt76 patches installed ==="
          ls -la openwrt/package/kernel/mt76/patches/ 2>/dev/null || echo "(none)"
          echo
          echo "=== mt76 PKG_SOURCE_VERSION ==="
          sed -n 's/^PKG_SOURCE_VERSION:=//p' openwrt/package/kernel/mt76/Makefile
          echo
          echo "=== patched mt7996_mcu_add_sta tail ==="
          MCU=openwrt/build_dir/target-*/linux-*/mt76-*/mt7996/mcu.c
          for f in $MCU; do
            [ -f "$f" ] || continue
            awk '/^out:/{p=1} p{print} /^}/{if(p)exit}' "$f" | head -30
          done
          echo
          echo "=== tr3600-fan file modes in built rootfs ==="
          find openwrt/build_dir -path '*luci-app-tr3600-fan*' -name 'tr3600-fan' -exec ls -l {} \; 2>/dev/null || true
          echo
          echo "=== tr3600-fan package provenance (sha256 of the source tree used) ==="
          find openwrt/package/custom/luci-app-tr3600-fan -type f \
            -exec sha256sum {} \; 2>/dev/null | sort -k2 || true
          echo
          echo "=== tr3600-fan entry-point modes (must be 755) ==="
          ls -l openwrt/package/custom/luci-app-tr3600-fan/root/usr/sbin/tr3600-fan \
                openwrt/package/custom/luci-app-tr3600-fan/root/etc/init.d/tr3600-fan \
                openwrt/package/custom/luci-app-tr3600-fan/root/etc/uci-defaults/99-tr3600-fan \
            2>/dev/null || true
        } > build-evidence.txt 2>&1
        cat build-evidence.txt

    - name: Upload build evidence
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && !cancelled()
      with:
        name: build-evidence-${{ env.BUILD_TIMESTAMP }}
        path: build-evidence.txt

    # =========================================================
    # 14. 上传固件到 Artifacts
    # =========================================================
    - name: Upload Firmware to Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.DEVICE_NAME }}-iStore-Ajay-${{ env.BUILD_TIMESTAMP }}
        path: ${{ env.FIRMWARE_DIR }}

    # =========================================================
    # 15. 生成 Release Tag 和说明
    # =========================================================
    - name: Generate Release Tag and Notes
      id: tag
      if: success() && !cancelled()
      run: |
        BUILD_TIME="$BUILD_TIMESTAMP"
        DEVICE="$DEVICE_NAME"

        # 對外標籤只留「設備 + 品牌 + 時間」，不帶上游作者與分支名。
        RELEASE_TAG="${DEVICE}-iStore-Ajay-${BUILD_TIME}"
        RELEASE_TAG=$(echo "$RELEASE_TAG" | sed 's/[^a-zA-Z0-9._-]/-/g')

        # 固件号：人一眼能认出这一版是哪一个构建
        FIRMWARE_NO="Ajay-${BUILD_TIME}-r${{ github.run_number }}"

        echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
        echo "firmware_no=${FIRMWARE_NO}" >> "$GITHUB_OUTPUT"

        cat <<EOF > release.txt
        ## 🚀 ${{ env.DEVICE_MODEL }} iStore OpenWrt 固件 (Ajay 定制版 + TR3600 build kit)

        ### 📋 编译信息
        | 项目 | 详情 |
        |------|------|
        | 📱 设备型号 | \`${{ env.DEVICE_MODEL }}\` |
        | 🔢 **固件号** | **\`${FIRMWARE_NO}\`** |
        | 🏷️ 固件标识 | ** iStore Ajay 定制版 + 風扇/LED/MAC/WiFi 修正** |
        | 🧱 构建基底 | \`openwrt-25.12\` + Cudy TR3600 v1 板级支持 |
        | ⏰ 编译时间 | $(date '+%Y-%m-%d %H:%M:%S') (Asia/Shanghai) |
        | 🏷️ 版本标签 | \`${RELEASE_TAG}\` |
        | 📄 配置文件 | \`${{ env.CONFIG_FILE }}\` |

        ### 📝 备注
        - 🔢 **固件号**：\`${FIRMWARE_NO}\`（构建号 r${{ github.run_number }}）
        - 📦 **风扇插件**：已内建在仓库 \`vendor/luci-app-tr3600-fan\`，不依赖任何第三方仓库
        - 🩹 **修正补丁**：6 个 —— 风扇 PWM 通道 / LED 颜色 / WiFi MAC 布局 / 温控曲线 /
          mt76 STA_REC 顺序 / LuCI 风扇页 dirty flag
        - 🧪 **上机自检**：\`scripts/tr3600-verify.sh\` 会核对以上每一项
        - 🚫 **本版移除**：\`luci-app-lucky\`（套件不够完善，暂不编入）
        - 👤 **定制**：Ajay

        ### 🔧 本版修正
        - ✅ **風扇 PWM**：DTS 由 PWM 通道 1 → **通道 0**（\`pwms = <&pwm 0 50000 0>\`），
          \`pinctrl-0\` 改為 \`pwm_pins\`，風扇測得到、可調速
        - ✅ **風扇腳本權限**：\`/usr/sbin/tr3600-fan\`、\`/etc/init.d/tr3600-fan\` 由 0644 → 0755
          （否則 \`exec_direct\` EACCES，LuCI 顯示「未檢測到風扇」）
        - ✅ **風扇溫控曲線**：60 °C 以下**停轉**，65 / 75 / 85 °C 三段
          （上游 40 °C 就鎖 50 %，待機時一直低鳴）
        - ✅ **LED 顏色**：\`led-0\` = **白**@GPIO48、\`led-1\` = **紅**@GPIO46（本板**無藍燈**）
        - ✅ **WiFi MAC**：2.4 GHz = **base+0x00**、5 GHz = **base+0x10**（與廠商一致）
        - ✅ **無線**：mt76 \`mt7996_mcu_add_sta()\` 改為先送 STA_REC、後送 VoW/DRR
          （修正 \`wifi down/up\` 後客戶端再也連不上的問題）

        ### 📦 包含插件
        - ✅ **Passwall**
        - ✅ **Passwall2**
        - ✅ **OpenClash**
        - ✅ **LuCI** 中文界面
        - ✅ **USB+F50 等驱动**
        - ✅ **Cudy TR3600风扇控制**
        - ✅ **iStore 应用商店**

        ### 🔧 刷机指南
        1. 下载对应固件文件
        2. 通过 Cudy 过渡中间固件后WEB网页后台或 Uboot 刷入
        3. 默认 IP: \`192.168.6.1\`
        4. 默认密码: \`password\`（空密码版本直接回车登录）

        ### ⚠️ 免责声明
        - 刷机有风险，请谨慎操作
        - 建议刷机前备份原厂固件
        - 本固件仅供学习研究使用

        ---
        > 📌 **固件号**: \`${FIRMWARE_NO}\` | **固件标识**: iStore Ajay 定制版 + TR3600 build kit | 构建时间: $(date '+%Y-%m-%d %H:%M:%S')
        EOF

        echo "status=success" >> "$GITHUB_OUTPUT"

    # =========================================================
    # 16. 创建 GitHub Release 并上传固件
    # =========================================================
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2.3.2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: ${{ env.DEVICE_MODEL }} OpenWrt iStore Ajay 定制版 - ${{ env.BUILD_TIMESTAMP }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE_DIR }}/*.bin
          ${{ env.FIRMWARE_DIR }}/*.itb
          ${{ env.FIRMWARE_DIR }}/*.manifest
          ${{ env.FIRMWARE_DIR }}/*.sha256sums
        draft: false
        prerelease: false

    # =========================================================
    # 17. 清理旧的 Releases（保留最近 10 个）
    # =========================================================
    - name: Remove Old Releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: success() && !cancelled()
      with:
        keep_latest: 10
        delete_tags: true
        delete_tag_pattern: '^${{ env.DEVICE_NAME }}-iStore-Ajay-'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

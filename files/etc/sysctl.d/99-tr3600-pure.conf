# TR3600 pure build — 網路堆疊調校
#
# 這個檔案由倉庫的 files/ overlay 蓋進 rootfs（include/image.mk 的 prepare_rootfs），
# 不是由 diy 腳本 append 到 /etc/sysctl.conf。
#
# 為什麼不寫 /etc/sysctl.conf：
#   sysctl.conf 是 conffile，列在 /lib/upgrade/keep.d/base-files-essential 裡，
#   sysupgrade 會「保留舊機上的那一份」→ 新映像裡的改動永遠被舊檔蓋掉
#   （實測：rmem_max 一直停在 208 KB，16 MB 從來沒生效過）。
#   /etc/sysctl.d/ 不在任何 keep.d 裡 → 每次刷機都用新映像的這份。
#   讀取順序：/etc/init.d/sysctl 先跑 /etc/sysctl.d/*.conf，最後才跑 /etc/sysctl.conf，
#   所以 99- 開頭會蓋掉映像內建的 10-/11-/12-（base-files / nf-conntrack / tcp-bbr）。

# fq 排程 + BBR 擁塞控制。
# ⚠️ sch_fq 來自 kmod-sched（config 已加 CONFIG_PACKAGE_kmod-sched=y）；
#    只有 kmod-sched-core 的話這一行會 write error: No such file or directory，
#    值會留在 fq_codel（實測過）。
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr

# 2.5G WAN 的 TCP 緩衝區。預設 208 KB 在高頻寬 × 高延遲下會限制單連線吞吐。
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.ipv4.tcp_rmem=4096 131072 16777216
net.ipv4.tcp_wmem=4096 65536 16777216

# 突發流量佇列（路由器瞬間轉發時少丟包）
net.core.netdev_max_backlog=2048
net.core.somaxconn=8192
net.ipv4.tcp_max_syn_backlog=4096

# conntrack 上限（預設 31232）。每條含 acct 約 300–400 B，65536 ≈ 25 MB，512 MB RAM 足夠。
# nf_conntrack 由 /etc/modules.d/nf-conntrack 在 S10 載入，早於 S11 的 sysctl，這裡一定寫得進去。
net.netfilter.nf_conntrack_max=65536
